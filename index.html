<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Converter</title>
    
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=arrow_circle_right" />
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="global.css">
</head>
<body>
    <header>
        <nav class="navigation">
            <h1>Converter</h1>
            <button class="burger_button">
                <svg  xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960"
                    width="24px" fill="#e8eaed">
                    <path d="M120-240v-80h720v80H120Zm0-200v-80h720v80H120Zm0-200v-80h720v80H120Z" />
                </svg>
            </button>
            <div class="tabs">
                <button class="tab">Temperature converter</button>
                <button class="tab">Currency converter</button>
                <button class="tab">Speed converter</button>
            </div>
        </nav>
    </header>
    <main>
        <div class="tabs-content">
            <div class="tab-content active">
                
                <h1 class="converter-name">Temperature Converter</h1>
                
                <div class="main-tab-content">

                    <div class="from">

                    
                        <select class="temperatureSelectField1" onchange="runTemperatureConverter()">
                            <option value="celsius" selected="selected">Celsius (°C)</option>
                            <option value="fahrenheit">Fahrenheit (°F)</option>
                            <option value="kelvin">Kelvin (K)</option>
                            <option value="rankine">Rankine (°R)</option>
                        </select>
                        <input type="text" inputmode="numeric" class="inputField_temperature" >
                        
                    </div>
                    <span class="material-symbols-outlined">
                        arrow_circle_right
                    </span>
                    <div class="to">
                        <select class="temperatureSelectField2" onchange="runTemperatureConverter()">
                            <option value="celsius">Celsius (°C)</option>
                            <option value="fahrenheit" selected="selected">Fahrenheit (°F)</option>
                            <option value="kelvin">Kelvin (K)</option>
                            <option value="rankine">Rankine (°R)</option>
                        </select>   
                        <output type="text" inputmode="numeric" class="outputField_temperature">
                    </div>
                    
                </div>
                <div class="temperature_indicator_div">
                    <div class="temperature_indicator">
                    
                    </div>
                </div>
                
            </div>
            
            <div class="tab-content">
                
                <h1 class="converter-name">Currency Converter</h1>
                <div class="tab-main-content-currency">

                    
                    <input type="text" inputmode="numeric" class="inputField_amount">   
                    
                    <div class="dropdown-menu">
                        <div class="dropdown-menu-content">
                            <img class="country-flag1" src="img/um.svg" alt="eu" width="40" height="30">
                            <select class="currencyField1" onchange="convertCurrency()">
                                <option value="USD" selected="selected">USD</option>
                                <option value="EUR">EUR</option>
                                <option value="JPY">JPY</option>
                                <option value="UAH">UAH</option>
                            </select>
                        </div>
                        <img src="img/arrow_forward.png" alt="arrow_forward" width="40" height="30">
                        <div class="dropdown-menu-content">
                            <img class="country-flag2" src="img/eu.svg" alt="eu" width="40" height="30">
                            <select class="currencyField2" onchange="convertCurrency()">
                                <option value="USD">USD</option>
                                <option value="EUR" selected="selected">EUR</option>
                                <option value="JPY">JPY</option>
                                <option value="UAH">UAH</option>
                            </select>
                        </div>
                    </div>
                    
                </div>  
                
                <div class="currency_output">
                    <h2>Result: </h2>
                    <p class="outputField_currency"></p>      
                </div>
            </div>
            <div class="tab-content">
                <h1 class="converter-name">Speed Converter</h1>
                <div class="main-tab-content">
                    
                    <div class="from">
                        
                        <select class="speedField1" onchange="runSpeedConverter()">
                            <option value="kmph" selected="selected">Km per hour (km/h)</option>
                            <option value="mps">Meters per second (m/s)</option>
                            <option value="fps">Feet per second (ft/s)</option>
                            <option value="yps">Yards per second (yd/s)</option>
                        </select>
                        <input type="text" inputmode="numeric" class="inputField_speed">
                        
                    </div>
                    <div class="to">
                        
                        <select class="speedField2" onchange=" runSpeedConverter()">
                            <option value="kmph">Km per hour (km/h)</option>
                            <option value="mps" selected="selected">Meters per second (m/s)</option>
                            <option value="fps">Feet per second (ft/s)</option>
                            <option value="yps">Yards per second (yd/s)</option>
                        </select>
                        <p class="outputField1_speed"></p>
                    </div>
                    
                </div>
            </div>
        </div>
           
            <script src="script.js"></script>
        </div>
    </main>
</body>
<footer>
    <div class="footer-item">
        <p>© 2025 Converter All rights reserved.</p>
        <p>
            <a href="#">Privacy Policy</a> 
            <a href="#">Terms and Conditions</a>
        </p>
    </div>
    <div class="footer-item">
        <p>Contact us at: <a href="mailto:support@yourwebsite.com">support@converter.com</a></p>
    </div>
    <div class="footer-item">
        <p>Follow us:</p>
        <ul>
            <li>
                <a href="#">Twitter</a>  
                <a href="#">Facebook</a> 
                <a href="#">Instagram</a>
            </li>
        </ul>
    </div>
</footer>
</html>
