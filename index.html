<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Converter</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <nav>
            <h1>Converter</h1>
            <div class="tabs">
                <button class="tab">Temperature converter</button>
                <button class="tab">Currency converter</button>
                <button class="tab">Speed converter</button>
            </div>
        </nav>
    </header>
    
    <div class="tabs-content">
        <div class="tab-content active">
            <div class="content">
                <div class="from">

                
                    <select class="temperatureSelectField1" onchange="runTemperatureConverter()">
                        <option value="celsius" selected="selected">Celsius (°C)</option>
                        <option value="fahrenheit">Fahrenheit (°F)</option>
                        <option value="kelvin">Kelvin (K)</option>
                        <option value="rankine">Rankine (°R)</option>
                    </select>
                    <input type="text" inputmode="numeric" class="inputField_temperature" >
                    
                </div>
                <div class="to">
                    <select class="temperatureSelectField2" onchange="runTemperatureConverter()">
                        <option value="celsius">Celsius (°C)</option>
                        <option value="fahrenheit" selected="selected">Fahrenheit (°F)</option>
                        <option value="kelvin">Kelvin (K)</option>
                        <option value="rankine">Rankine (°R)</option>
                    </select>   
                    <output type="text" inputmode="numeric" class="outputField_temperature">
                </div>
                
            </div>
            <div class="temperature_indicator_div">
                <div class="temperature_indicator">
                
                </div>
            </div>
            
        </div>
        <div class="tab-content">
            <select class="currencyField1" onchange="convertCurrency()">
                <option value="USD" selected="selected">USD</option>
                <option value="EUR">EUR</option>
                <option value="JPY">JPY</option>
                <option value="UAH">UAH</option>
            </select>
            <select class="currencyField2" onchange="convertCurrency()">
                <option value="USD">USD</option>
                <option value="EUR" selected="selected">EUR</option>
                <option value="JPY">JPY</option>
                <option value="UAH">UAH</option>
            </select>
            <input type="text" inputmode="numeric" class="inputField_amount" >
            
            <p class="outputField_currency"></p>

            
        </div>
        <div class="tab-content">
            <select class="speedField1" onchange="runSpeedConverter()">
                <option value="kmph" selected="selected">Km per hour (km/h)</option>
                <option value="mps">Meters per second (m/s)</option>
                <option value="fps">Feet per second (ft/s)</option>
                <option value="yps">Yards per second (yd/s)</option>
            </select>
            <select class="speedField2" onchange=" runSpeedConverter()">
                <option value="kmph">Km per hour (km/h)</option>
                <option value="mps" selected="selected">Meters per second (m/s)</option>
                <option value="fps">Feet per second (ft/s)</option>
                <option value="yps">Yards per second (yd/s)</option>
            </select>
            
            <input type="text" inputmode="numeric" class="inputField_speed" >
            <p class="outputField1_speed"></p>

        </div>
        <script src="script.js"></script>
    </div>
</body>
</html>
